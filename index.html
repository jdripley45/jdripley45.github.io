<html lang="en">

<head>

    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            overflow-x: hidden;
        }


        /* =========================
           Header
        ========================== */

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }


        header h1 {
            margin: 0;
            font-size: 36px;
        }


        header p {
            margin-top: 10px;
            color: #666;
        }


        /* =========================
           Calendar Container
        ========================== */

        .calendar-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }


        /* =========================
           Month
        ========================== */

        .month {
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           Month Navigation
        ========================== */

        .navigation {
            display: grid;
            grid-template-columns: 50px minmax(0, 1fr) 50px;
            align-items: center;
            margin-bottom: 20px;
        }


        .navigation h2 {
            margin: 0;
            text-align: center;
            font-size: 24px;
        }


        .nav-button {
            width: 45px;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 24px;
            cursor: pointer;
        }


        .nav-button:hover {
            background: #eee;
        }


        .nav-button:disabled {
            color: #bbb;
            background: #f5f5f5;
            cursor: not-allowed;
        }


        .nav-button:disabled:hover {
            background: #f5f5f5;
        }


        /* =========================
           Today Button
        ========================== */

        .today-button-container {
            text-align: center;
            margin-bottom: 20px;
        }


        .today-button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            cursor: pointer;
        }


        .today-button:hover {
            background: #eee;
        }


        /* =========================
           Weekdays
        ========================== */

        .weekdays,
        .days {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }


        .weekday {
            min-width: 0;
            text-align: center;
            font-weight: bold;
            color: #777;
            padding: 8px 2px;
        }


        /* =========================
           Calendar Days
        ========================== */

        .day {
            width: 100%;
            min-width: 0;
            min-height: 80px;

            border: 1px solid #ddd;
            border-radius: 8px;

            padding: 10px;

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;

            background: #fafafa;

            font-size: 16px;

            overflow: hidden;
        }


        /* =========================
           Available Past Dates
        ========================== */

        .day.available {
            cursor: pointer;
        }


        .day.available:hover {
            background: #eee;
        }


        /* =========================
           Future Dates
        ========================== */

        .day.locked {
            color: #aaa;
            background: #f3f3f3;
            cursor: not-allowed;
        }


        .day.locked:hover {
            background: #f3f3f3;
        }


        /* =========================
           Today's Date
        ========================== */

        .day.today {
            border: 2px solid #222;
            background: #e8e8e8;
            font-weight: bold;
            cursor: pointer;
        }


        .day.today:hover {
            background: #ddd;
        }


        /* =========================
           Empty Calendar Spaces
        ========================== */

        .day.empty {
            border: none;
            background: transparent;
            cursor: default;
        }


        .day.empty:hover {
            background: transparent;
        }


        /* =========================
           Day Number
        ========================== */

        .day-number {
            display: block;
            line-height: 1;
        }


        /* =========================
           Status Text
        ========================== */

        .status {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.2;
        }


        .locked .status {
            color: #999;
        }


        .today .status {
            color: #555;
        }


        /* =========================
           NOTE OVERLAY
        ========================== */

        .note-overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.45);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }


        .note-overlay.visible {
            opacity: 1;
            visibility: visible;
        }


        /* =========================
           LINED PAPER
        ========================== */

        .note-paper {
            position: relative;

            width: 100%;
            max-width: 700px;
            max-height: 85vh;

            overflow-y: auto;

            padding:
                55px
                55px
                60px
                75px;

            border-radius: 3px;

            background-color: #fffdf5;

            /*
                Horizontal notebook lines
            */

            background-image:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 31px,
                    #b9d0df 32px,
                    #b9d0df 33px
                );

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

            transform: translateY(20px) rotate(-0.3deg);

            transition:
                transform 0.25s ease;
        }


        .note-overlay.visible .note-paper {
            transform:
                translateY(0)
                rotate(-0.3deg);
        }


        /* =========================
           Paper Red Margin
        ========================== */

        .note-paper::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 52px;

            width: 1px;

            background: #e3a4a4;
        }


        /* =========================
           Close Button
        ========================== */

        .close-note {
            position: absolute;

            top: 15px;
            right: 18px;

            width: 35px;
            height: 35px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.06);

            font-size: 22px;
            line-height: 35px;

            cursor: pointer;

            z-index: 2;
        }


        .close-note:hover {
            background: rgba(0, 0, 0, 0.12);
        }


        /* =========================
           Note Date
        ========================== */

        .note-date {
            position: relative;

            margin: 0 0 15px 0;

            font-family: "Caveat", cursive;

            font-size: 28px;
            font-weight: 500;

            line-height: 33px;

            color: #333;
        }


        /* =========================
           Note Text
        ========================== */

        .note-text {
            position: relative;

            margin: 0;

            font-family: "Caveat", cursive;

            font-size: 26px;
            font-weight: 400;

            line-height: 33px;

            color: #222;

            white-space: pre-wrap;
        }


        /* =========================
           MOBILE / PORTRAIT
        ========================== */

        @media (max-width: 600px) {

            header {
                padding:
                    25px
                    10px
                    20px;
            }


            header h1 {
                font-size: 28px;
            }


            .calendar-container {
                padding:
                    0
                    8px;
            }


            .month {
                padding:
                    15px
                    8px;

                border-radius: 10px;
            }


            .navigation {
                grid-template-columns:
                    42px
                    minmax(0, 1fr)
                    42px;

                margin-bottom: 15px;
            }


            .navigation h2 {
                font-size: 20px;
            }


            .nav-button {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }


            .weekdays,
            .days {
                gap: 4px;
            }


            .weekday {
                padding:
                    6px
                    0;

            }


            .day {
                min-height: 58px;

                    7px
                    5px;

            }


            .status {
                margin-top: 5px;

            }


            .today-button-container {
                margin-bottom: 15px;
            }


            .today-button {
                padding:
                    7px
                    14px;

                font-size: 13px;
            }


            /* Note on phone */

            .note-overlay {
                padding: 12px;
            }


            .note-paper {
                max-height: 90vh;

                padding:
                    50px
                    25px
                    50px
                    45px;

                background-image:
                    repeating-linear-gradient(
                        to bottom,
                        transparent 0px,
                        transparent 27px,
                        #b9d0df 28px,
                        #b9d0df 29px
                    );
            }


            .note-paper::before {
                left: 30px;
            }


            .note-date {
                font-size: 23px;
                line-height: 29px;
            }


            .note-text {
                font-size: 23px;
                line-height: 29px;
            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================== */

        @media (max-width: 380px) {

            .calendar-container {
                padding:
                    0
                    5px;
            }


            .month {
                padding:
                    12px
                    5px;
            }


            .weekdays,
            .days {
                gap: 3px;
            }


            .day {
                min-height: 52px;

                padding:
                    6px
                    4px;

                font-size: 13px;
            }


            .status {
                font-size: 8px;
            }


            .weekday {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>Dear Lucie...</h1>

        <p></p>

    </header>


    <!-- =========================
         CALENDAR
    ========================== -->

    <div
        class="calendar-container"
        id="calendar">
    </div>


    <!-- =========================
         NOTE POPUP
    ========================== -->

    <div
        class="note-overlay"
        id="noteOverlay"
    >

        <div
            class="note-paper"
            id="notePaper"
        >

            <button
                class="close-note"
                id="closeNote"
                aria-label="Close note"
            >
                ×
            </button>


            <h2
                class="note-date"
                id="noteDate"
            ></h2>


            <p
                class="note-text"
                id="noteText"
            ></p>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        const calendar =
            document.getElementById("calendar");


        const noteOverlay =
            document.getElementById("noteOverlay");


        const closeNote =
            document.getElementById("closeNote");


        const noteDate =
            document.getElementById("noteDate");


        const noteText =
            document.getElementById("noteText");


        /* =========================
           MONTH NAMES
        ========================== */

        const monthNames = [

            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"

        ];


        /* =========================
           WEEKDAY NAMES
        ========================== */

        const weekdayNames = [

            "Sun",
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat"

        ];


        /* =========================
           STARTING MONTH
        ========================== */

        const startingMonth = 8;

        const startingYear = 2026;


        /* =========================
           GET EASTERN DATE
        ========================== */

        function getEasternDate() {

            const easternDate =
                new Intl.DateTimeFormat(
                    "en-US",
                    {
                        timeZone:
                            "America/New_York",

                        year:
                            "numeric",

                        month:
                            "numeric",

                        day:
                            "numeric"
                    }
                ).formatToParts(
                    new Date()
                );


            let year;
            let month;
            let day;


            easternDate.forEach(
                part => {

                    if (
                        part.type === "year"
                    ) {

                        year =
                            Number(
                                part.value
                            );

                    }


                    if (
                        part.type === "month"
                    ) {

                        month =
                            Number(
                                part.value
                            ) - 1;

                    }


                    if (
                        part.type === "day"
                    ) {

                        day =
                            Number(
                                part.value
                            );

                    }

                }
            );


            return {
                year: year,
                month: month,
                day: day
            };

        }


        /* =========================
           COMPARE DATES
        ========================== */

        function compareDates(
            year1,
            month1,
            day1,
            year2,
            month2,
            day2
        ) {

            const date1 =
                new Date(
                    year1,
                    month1,
                    day1
                );


            const date2 =
                new Date(
                    year2,
                    month2,
                    day2
                );


            if (
                date1 < date2
            ) {

                return -1;

            }


            if (
                date1 > date2
            ) {

                return 1;

            }


            return 0;

        }


        /* =========================
           TODAY
        ========================== */

        const today =
            getEasternDate();


        /* =========================
           CURRENT CALENDAR MONTH
        ========================== */

        let currentMonth =
            Math.max(
                today.month,
                startingMonth
            );


        let currentYear =
            Math.max(
                today.year,
                startingYear
            );


        if (
            currentYear === startingYear &&
            currentMonth < startingMonth
        ) {

            currentMonth =
                startingMonth;

        }


        /* =========================
           OPEN NOTE
        ========================== */

        function openNote(
            year,
            month,
            day
        ) {

            /*
                Temporary placeholder.

                We will replace this
                with the actual note
                for this date later.
            */

            noteDate.textContent =
                `${monthNames[month]} ${day}, ${year}`;


            noteText.textContent =
                "This is where your note for this day will appear.\n\n" +
                "Once we add your daily messages, the text will appear here on the lined paper in a handwritten style.";


            noteOverlay.classList.add(
                "visible"
            );

        }


        /* =========================
           CLOSE NOTE
        ========================== */

        function closeNoteWindow() {

            noteOverlay.classList.remove(
                "visible"
            );

        }


        closeNote.addEventListener(
            "click",
            closeNoteWindow
        );


        /* =========================
           CLICK OUTSIDE NOTE
        ========================== */

        noteOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target === noteOverlay
                ) {

                    closeNoteWindow();

                }

            }
        );


        /* =========================
           ESCAPE KEY
        ========================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeNoteWindow();

                }

            }
        );


        /* =========================
           CREATE CALENDAR
        ========================== */

        function createCalendar(
            year,
            month
        ) {

            calendar.innerHTML = "";


            /* -------------------------
               Month Container
            ------------------------- */

            const monthContainer =
                document.createElement(
                    "div"
                );


            monthContainer.className =
                "month";


            /* -------------------------
               Navigation
            ------------------------- */

            const navigation =
                document.createElement(
                    "div"
                );


            navigation.className =
                "navigation";


            /* Previous */

            const previousButton =
                document.createElement(
                    "button"
                );


            previousButton.textContent =
                "←";


            previousButton.className =
                "nav-button";


            if (
                year === startingYear &&
                month === startingMonth
            ) {

                previousButton.disabled =
                    true;

            }


            /* Title */

            const title =
                document.createElement(
                    "h2"
                );


            title.textContent =
                `${monthNames[month]} ${year}`;


            /* Next */

            const nextButton =
                document.createElement(
                    "button"
                );


            nextButton.textContent =
                "→";


            nextButton.className =
                "nav-button";


            navigation.appendChild(
                previousButton
            );


            navigation.appendChild(
                title
            );


            navigation.appendChild(
                nextButton
            );


            monthContainer.appendChild(
                navigation
            );


            /* -------------------------
               Today Button
            ------------------------- */

            const todayButtonContainer =
                document.createElement(
                    "div"
                );


            todayButtonContainer.className =
                "today-button-container";


            const todayButton =
                document.createElement(
                    "button"
                );


            todayButton.textContent =
                "Today";


            todayButton.className =
                "today-button";


            todayButtonContainer.appendChild(
                todayButton
            );


            monthContainer.appendChild(
                todayButtonContainer
            );


            /* -------------------------
               Weekdays
            ------------------------- */

            const weekdays =
                document.createElement(
                    "div"
                );


            weekdays.className =
                "weekdays";


            weekdayNames.forEach(
                day => {

                    const weekday =
                        document.createElement(
                            "div"
                        );


                    weekday.className =
                        "weekday";


                    weekday.textContent =
                        day;


                    weekdays.appendChild(
                        weekday
                    );

                }
            );


            monthContainer.appendChild(
                weekdays
            );


            /* -------------------------
               Days
            ------------------------- */

            const daysContainer =
                document.createElement(
                    "div"
                );


            daysContainer.className =
                "days";


            /* First Day */

            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            /* Number Of Days */

            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /* Empty Spaces */

            for (
                let i = 0;
                i < firstDay;
                i++
            ) {

                const emptyDay =
                    document.createElement(
                        "div"
                    );


                emptyDay.className =
                    "day empty";


                daysContainer.appendChild(
                    emptyDay
                );

            }


            /* -------------------------
               Create Individual Days
            ------------------------- */

            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const dayBox =
                    document.createElement(
                        "div"
                    );


                const comparison =
                    compareDates(
                        year,
                        month,
                        day,
                        today.year,
                        today.month,
                        today.day
                    );


                /* -------------------------
                   Day Number
                ------------------------- */

                const dayNumber =
                    document.createElement(
                        "span"
                    );


                dayNumber.className =
                    "day-number";


                dayNumber.textContent =
                    day;


                dayBox.appendChild(
                    dayNumber
                );


                /* =========================
                   FUTURE
                ========================== */

                if (
                    comparison > 0
                ) {

                    dayBox.className =
                        "day locked";


                    const status =
                        document.createElement(
                            "span"
                        );


                    status.className =
                        "status";


                    status.textContent =
                        "🔒 Locked";


                    dayBox.appendChild(
                        status
                    );

                }


                /* =========================
                   TODAY
                ========================== */

                else if (
                    comparison === 0
                ) {

                    dayBox.className =
                        "day today";


                    const status =
                        document.createElement(
                            "span"
                        );


                    status.className =
                        "status";


                    status.textContent =
                        "💌 Today";


                    dayBox.appendChild(
                        status
                    );


                    dayBox.addEventListener(
                        "click",
                        () => {

                            openNote(
                                year,
                                month,
                                day
                            );

                        }
                    );

                }


                /* =========================
                   PAST
                ========================== */

                else {

                    dayBox.className =
                        "day available";


                    const status =
                        document.createElement(
                            "span"
                        );


                    status.className =
                        "status";


                    status.textContent =
                        "💌 Available";


                    dayBox.appendChild(
                        status
                    );


                    dayBox.addEventListener(
                        "click",
                        () => {

                            openNote(
                                year,
                                month,
                                day
                            );

                        }
                    );

                }


                daysContainer.appendChild(
                    dayBox
                );

            }


            monthContainer.appendChild(
                daysContainer
            );


            calendar.appendChild(
                monthContainer
            );


            /* =========================
               PREVIOUS MONTH
            ========================== */

            previousButton.addEventListener(
                "click",
                () => {

                    if (
                        year === startingYear &&
                        month === startingMonth
                    ) {

                        return;

                    }


                    if (
                        currentMonth === 0
                    ) {

                        currentMonth =
                            11;

                        currentYear--;

                    }

                    else {

                        currentMonth--;

                    }


                    createCalendar(
                        currentYear,
                        currentMonth
                    );

                }
            );


            /* =========================
               NEXT MONTH
            ========================== */

            nextButton.addEventListener(
                "click",
                () => {

                    if (
                        currentMonth === 11
                    ) {

                        currentMonth =
                            0;

                        currentYear++;

                    }

                    else {

                        currentMonth++;

                    }


                    createCalendar(
                        currentYear,
                        currentMonth
                    );

                }
            );


            /* =========================
               TODAY BUTTON
            ========================== */

            todayButton.addEventListener(
                "click",
                () => {

                    const currentDate =
                        getEasternDate();


                    currentMonth =
                        currentDate.month;


                    currentYear =
                        currentDate.year;


                    if (
                        currentYear < startingYear ||
                        (
                            currentYear === startingYear &&
                            currentMonth < startingMonth
                        )
                    ) {

                        currentYear =
                            startingYear;

                        currentMonth =
                            startingMonth;

                    }


                    createCalendar(
                        currentYear,
                        currentMonth
                    );

                }
            );

        }


        /* =========================
           START CALENDAR
        ========================== */

        createCalendar(
            currentYear,
            currentMonth
        );

    </script>

</body>

</html>
