<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>365 Daily Notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 10px;
            color: #666;
        }

        .calendar-container {
            max-width: 1000px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .month {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .month h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            color: #777;
            padding: 8px;
        }

        .day {
            min-height: 80px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            background: #fafafa;
            font-size: 16px;
        }

        .day.empty {
            border: none;
            background: transparent;
        }

        .day:hover:not(.empty) {
            background: #eee;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 28px;
            }

            .month {
                padding: 15px;
            }

            .day {
                min-height: 55px;
                padding: 6px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>365 Daily Notes</h1>
        <p>A new note every day.</p>
    </header>

    <div class="calendar-container">

        <div class="month">
            <h2>September 2026</h2>

            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>

            <div class="days">
                <div class="day empty"></div>
                <div class="day">1</div>
                <div class="day">2</div>
                <div class="day">3</div>
                <div class="day">4</div>
                <div class="day">5</div>
                <div class="day">6</div>

                <div class="day">7</div>
                <div class="day">8</div>
                <div class="day">9</div>
                <div class="day">10</div>
                <div class="day">11</div>
                <div class="day">12</div>
                <div class="day">13</div>

                <div class="day">14</div>
                <div class="day">15</div>
                <div class="day">16</div>
                <div class="day">17</div>
                <div class="day">18</div>
                <div class="day">19</div>
                <div class="day">20</div>

                <div class="day">21</div>
                <div class="day">22</div>
                <div class="day">23</div>
                <div class="day">24</div>
                <div class="day">25</div>
                <div class="day">26</div>
                <div class="day">27</div>

                <div class="day">28</div>
                <div class="day">29</div>
                <div class="day">30</div>
                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day empty"></div>
            </div>
        </div>

    </div>

</body>
</html>
