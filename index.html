<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dear Lucie...</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           GLOBAL
        ====================================================== */

        :root {

            --pink: #d66f8a;
            --pink-dark: #b95570;
            --pink-light: #f8e3e8;
            --pink-soft: #fdf3f5;

            --cream: #fffaf8;

            --text: #30282a;
            --text-light: #7e7074;

            --border: #eadde0;

            --shadow:
                0 10px 30px rgba(80, 40, 50, 0.07);

            --shadow-hover:
                0 14px 35px rgba(80, 40, 50, 0.13);

        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fffafa 0%,
                    #fdf5f7 50%,
                    #fffafa 100%
                );

            color: var(--text);

            overflow-x: hidden;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        header {

            text-align: center;

            padding:
                55px
                20px
                35px;

            max-width: 800px;

            margin: 0 auto;

        }


        header h1 {

            margin: 0;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 52px;

            font-weight: 500;

            letter-spacing: -0.5px;

            color: var(--text);

        }


        /*
           Small decorative line
        */

        .header-decoration {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin:
                10px
                auto
                18px;

            color: var(--pink);

            font-size: 14px;

        }


        .header-decoration::before,
        .header-decoration::after {

            content: "";

            width: 45px;

            height: 1px;

            background:
                #e5c6ce;

        }


        .header-decoration span {

            font-size: 15px;

        }


        /*
           Quote
        */

        .header-quote {

            margin: 0 auto;

            max-width: 650px;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 21px;

            line-height: 1.45;

            font-style: italic;

            color: #66595d;

        }


        .quote-author {

            display: block;

            margin-top: 10px;

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            font-size: 11px;

            font-style: normal;

            font-weight: 500;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: var(--pink-dark);

        }


        /* =====================================================
           CALENDAR CONTAINER
        ====================================================== */

        .calendar-container {

            width: 100%;

            max-width: 1050px;

            margin:
                0 auto
                60px;

            padding:
                0 20px;

        }


        /* =====================================================
           MONTH CARD
        ====================================================== */

        .month {

            width: 100%;

            background:
                rgba(255, 255, 255, 0.94);

            border:
                1px solid
                rgba(214, 111, 138, 0.12);

            border-radius: 20px;

            padding: 30px;

            margin-bottom: 30px;

            box-shadow:
                0 12px 35px
                rgba(75, 35, 45, 0.07);

        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        .navigation {

            display: grid;

            grid-template-columns:
                50px
                minmax(0, 1fr)
                50px;

            align-items: center;

            margin-bottom: 22px;

        }


        .navigation h2 {

            margin: 0;

            text-align: center;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 30px;

            font-weight: 600;

            color: var(--text);

        }


        .nav-button {

            width: 42px;

            height: 42px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            background: white;

            color: var(--pink-dark);

            font-size: 20px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;

        }


        .nav-button:hover {

            background:
                var(--pink-soft);

            border-color:
                #e6b8c4;

            transform:
                translateY(-2px);

        }


        .nav-button:disabled {

            color: #cfc4c7;

            background:
                #faf8f8;

            border-color:
                #eee8e9;

            cursor:
                not-allowed;

            transform: none;

        }


        .nav-button:disabled:hover {

            background:
                #faf8f8;

        }


        /* =====================================================
           TODAY BUTTON
        ====================================================== */

        .today-button-container {

            text-align: center;

            margin-bottom: 25px;

        }


        .today-button {

            padding:
                8px
                18px;

            border:
                1px solid
                #e5c3cb;

            border-radius: 30px;

            background:
                var(--pink-soft);

            color:
                var(--pink-dark);

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.4px;

            cursor: pointer;

            transition:
                all 0.2s ease;

        }


        .today-button:hover {

            background:
                var(--pink);

            color: white;

            border-color:
                var(--pink);

            transform:
                translateY(-1px);

        }


        /* =====================================================
           WEEKDAYS
        ====================================================== */

        .weekdays,
        .days {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(
                    7,
                    minmax(0, 1fr)
                );

            gap: 9px;

        }


        .weekday {

            min-width: 0;

            text-align: center;

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 1px;

            text-transform: uppercase;

            color:
                #a18f94;

            padding:
                7px
                2px
                10px;

        }


        /* =====================================================
           CALENDAR DAYS
        ====================================================== */

        .day {

            position: relative;

            width: 100%;

            min-width: 0;

            min-height: 82px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            padding:
                11px;

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            justify-content: flex-start;

            background:
                #fffdfd;

            color:
                var(--text);

            font-size: 14px;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;

        }


        /* =====================================================
           AVAILABLE DAYS
        ====================================================== */

        .day.available {

            cursor: pointer;

        }


        .day.available:hover {

            background:
                #fff7f8;

            border-color:
                #e6b9c3;

            box-shadow:
                var(--shadow-hover);

            transform:
                translateY(-3px);

        }


        .day.available::after {

            content: "♡";

            position: absolute;

            right: 9px;

            bottom: 7px;

            font-family:
                Georgia,
                serif;

            font-size: 16px;

            color:
                #e5a6b6;

        }


        /* =====================================================
           FUTURE DAYS
        ====================================================== */

        .day.locked {

            color:
                #b9afb2;

            background:
                #faf9f9;

            border-color:
                #eee8e9;

            cursor:
                not-allowed;

        }


        .day.locked:hover {

            background:
                #faf9f9;

        }


        /* =====================================================
           TODAY
        ====================================================== */

        .day.today {

            border:
                2px solid
                var(--pink);

            background:
                linear-gradient(
                    145deg,
                    #fff4f6,
                    #fce9ed
                );

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 6px 18px
                rgba(214, 111, 138, 0.16);

        }


        .day.today:hover {

            background:
                linear-gradient(
                    145deg,
                    #fcecef,
                    #f9dfe5
                );

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(214, 111, 138, 0.22);

        }


        .day.today::after {

            content: "♥";

            position: absolute;

            right: 9px;

            bottom: 7px;

            font-size: 13px;

            color:
                var(--pink);

        }


        /* =====================================================
           EMPTY SPACES
        ====================================================== */

        .day.empty {

            border: none;

            background:
                transparent;

            cursor: default;

        }


        .day.empty:hover {

            background:
                transparent;

            transform: none;

            box-shadow: none;

        }


        /* =====================================================
           DAY NUMBER
        ====================================================== */

        .day-number {

            display: block;

            line-height: 1;

            font-size: 15px;

            font-weight: 600;

        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status {

            display: block;

            margin-top: 9px;

            font-size: 10px;

            font-weight: 500;

            line-height: 1.2;

            color:
                #9b858b;

        }


        .available .status {

            color:
                var(--pink-dark);

        }


        .locked .status {

            color:
                #b6adaf;

        }


        .today .status {

            color:
                var(--pink-dark);

        }


        /* =====================================================
           NOTE OVERLAY
        ====================================================== */

        .note-overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(45, 28, 33, 0.52);

            backdrop-filter:
                blur(4px);

            -webkit-backdrop-filter:
                blur(4px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 1000;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

        }


        .note-overlay.visible {

            opacity: 1;

            visibility: visible;

        }


        /* =====================================================
           LINED PAPER
        ====================================================== */

        .note-paper {

            position: relative;

            width: 100%;

            max-width: 700px;

            max-height: 85vh;

            overflow-y: auto;

            padding:
                60px
                60px
                65px
                80px;

            border-radius: 4px;

            background-color:
                #fffdf6;

            background-image:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 31px,
                    #bfd1dc 32px,
                    #bfd1dc 33px
                );

            box-shadow:
                0 25px 60px
                rgba(30, 15, 20, 0.3);

            transform:
                translateY(25px)
                rotate(-0.4deg);

            transition:
                transform 0.3s ease;

        }


        .note-overlay.visible .note-paper {

            transform:
                translateY(0)
                rotate(-0.4deg);

        }


        /* =====================================================
           PAPER RED MARGIN
        ====================================================== */

        .note-paper::before {

            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 54px;

            width: 1px;

            background:
                #e3a4a4;

        }


        /* =====================================================
           CLOSE BUTTON
        ====================================================== */

        .close-note {

            position: absolute;

            top: 15px;

            right: 18px;

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.055);

            color:
                #66595d;

            font-size: 22px;

            line-height: 35px;

            cursor: pointer;

            z-index: 2;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .close-note:hover {

            background:
                rgba(214, 111, 138, 0.15);

            color:
                var(--pink-dark);

            transform:
                rotate(90deg);

        }


        /* =====================================================
           NOTE DATE
        ====================================================== */

        .note-date {

            position: relative;

            margin:
                0
                0
                15px
                0;

            font-family:
                "Caveat",
                cursive;

            font-size: 30px;

            font-weight: 500;

            line-height: 33px;

            color:
                #4a3d40;

        }


        /* =====================================================
           NOTE TEXT
        ====================================================== */

        .note-text {

            position: relative;

            margin: 0;

            font-family:
                "Caveat",
                cursive;

            font-size: 27px;

            font-weight: 400;

            line-height: 33px;

            color:
                #2e282a;

            white-space: pre-wrap;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            header {

                padding:
                    35px
                    12px
                    28px;

            }


            header h1 {

                font-size: 42px;

            }


            .header-decoration {

                margin-top: 6px;

                margin-bottom: 15px;

            }


            .header-decoration::before,
            .header-decoration::after {

                width: 30px;

            }


            .header-quote {

                font-size: 18px;

                line-height: 1.4;

                max-width: 350px;

            }


            .quote-author {

                font-size: 9px;

                letter-spacing: 1.2px;

                margin-top: 8px;

            }


            .calendar-container {

                padding:
                    0
                    8px;

                margin-bottom:
                    40px;

            }


            .month {

                padding:
                    18px
                    8px;

                border-radius:
                    16px;

            }


            .navigation {

                grid-template-columns:
                    42px
                    minmax(0, 1fr)
                    42px;

                margin-bottom:
                    18px;

            }


            .navigation h2 {

                font-size: 25px;

            }


            .nav-button {

                width: 36px;

                height: 36px;

                border-radius: 10px;

                font-size: 18px;

            }


            .weekdays,
            .days {

                gap: 4px;

            }


            .weekday {

                padding:
                    6px
                    0
                    9px;

                font-size: 9px;

                letter-spacing: 0.5px;

            }


            .day {

                min-height: 62px;

                padding:
                    8px
                    5px;

                border-radius: 8px;

                font-size: 13px;

            }


            .day-number {

                font-size: 13px;

            }


            .status {

                margin-top: 6px;

                font-size: 8px;

            }


            .day.available::after,
            .day.today::after {

                right: 5px;

                bottom: 4px;

                font-size: 12px;

            }


            .today-button-container {

                margin-bottom:
                    18px;

            }


            .today-button {

                padding:
                    7px
                    15px;

                font-size: 11px;

            }


            /* -------------------------
               Note
            ------------------------- */

            .note-overlay {

                padding:
                    12px;

            }


            .note-paper {

                max-height:
                    90vh;

                padding:
                    50px
                    25px
                    50px
                    45px;

                background-image:
                    repeating-linear-gradient(
                        to bottom,
                        transparent 0px,
                        transparent 27px,
                        #bfd1dc 28px,
                        #bfd1dc 29px
                    );

            }


            .note-paper::before {

                left: 30px;

            }


            .note-date {

                font-size:
                    24px;

                line-height:
                    29px;

            }


            .note-text {

                font-size:
                    23px;

                line-height:
                    29px;

            }

        }


        /* =====================================================
           VERY SMALL PHONES
        ====================================================== */

        @media (max-width: 380px) {

            header {

                padding:
                    28px
                    8px
                    23px;

            }


            header h1 {

                font-size: 37px;

            }


            .header-quote {

                font-size: 17px;

            }


            .calendar-container {

                padding:
                    0
                    5px;

            }


            .month {

                padding:
                    14px
                    5px;

            }


            .weekdays,
            .days {

                gap: 3px;

            }


            .day {

                min-height:
                    55px;

                padding:
                    7px
                    4px;

                font-size:
                    12px;

            }


            .day-number {

                font-size:
                    12px;

            }


            .status {

                font-size:
                    7px;

            }


            .weekday {

                font-size:
                    8px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>
            Dear Lucie...
        </h1>


        <div class="header-decoration">
            <span>♡</span>
        </div>


        <p class="header-quote">

            “To send a letter is a good way to go somewhere,
            without moving anything but your heart.”

            <span class="quote-author">
                — Phyllis Grissim-Theroux —
            </span>

        </p>

    </header>


    <!-- =====================================================
         CALENDAR
    ====================================================== -->

    <div
        class="calendar-container"
        id="calendar"
    ></div>


    <!-- =====================================================
         NOTE POPUP
    ====================================================== -->

    <div
        class="note-overlay"
        id="noteOverlay"
    >

        <div
            class="note-paper"
            id="notePaper"
        >

            <button
                class="close-note"
                id="closeNote"
                aria-label="Close note"
            >
                ×
            </button>


            <h2
                class="note-date"
                id="noteDate"
            ></h2>


            <p
                class="note-text"
                id="noteText"
            ></p>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="notes.js"></script>

    <script>

        const calendar =
            document.getElementById("calendar");


        const noteOverlay =
            document.getElementById("noteOverlay");


        const closeNote =
            document.getElementById("closeNote");


        const noteDate =
            document.getElementById("noteDate");


        const noteText =
            document.getElementById("noteText");


        /* =====================================================
           MONTH NAMES
        ====================================================== */

        const monthNames = [

            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"

        ];


        /* =====================================================
           WEEKDAY NAMES
        ====================================================== */

        const weekdayNames = [

            "Sun",
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat"

        ];


        /* =====================================================
           STARTING MONTH
        ====================================================== */

        const startingMonth = 8;

        const startingYear = 2026;


        /* =====================================================
           GET EASTERN DATE
        ====================================================== */

        function getEasternDate() {

            const easternDate =
                new Intl.DateTimeFormat(
                    "en-US",
                    {
                        timeZone:
                            "America/New_York",

                        year:
                            "numeric",

                        month:
                            "numeric",

                        day:
                            "numeric"
                    }
                ).formatToParts(
                    new Date()
                );


            let year;

            let month;

            let day;


            easternDate.forEach(
                part => {

                    if (
                        part.type === "year"
                    ) {

                        year =
                            Number(
                                part.value
                            );

                    }


                    if (
                        part.type === "month"
                    ) {

                        month =
                            Number(
                                part.value
                            ) - 1;

                    }


                    if (
                        part.type === "day"
                    ) {

                        day =
                            Number(
                                part.value
                            );

                    }

                }
            );


            return {

                year:
                    year,

                month:
                    month,

                day:
                    day

            };

        }


        /* =====================================================
           COMPARE DATES
        ====================================================== */

        function compareDates(

            year1,
            month1,
            day1,

            year2,
            month2,
            day2

        ) {

            const date1 =
                new Date(
                    year1,
                    month1,
                    day1
                );


            const date2 =
                new Date(
                    year2,
                    month2,
                    day2
                );


            if (
                date1 < date2
            ) {

                return -1;

            }


            if (
                date1 > date2
            ) {

                return 1;

            }


            return 0;

        }


        /* =====================================================
           CURRENT DATE
        ====================================================== */

        let today =
            getEasternDate();


        /* =====================================================
           CURRENT CALENDAR MONTH
        ====================================================== */

        let currentMonth =
            Math.max(
                today.month,
                startingMonth
            );


        let currentYear =
            Math.max(
                today.year,
                startingYear
            );


        if (

            currentYear === startingYear &&
            currentMonth < startingMonth

        ) {

            currentMonth =
                startingMonth;

        }


        /* =====================================================
           OPEN NOTE
        ====================================================== */

        function openNote(

            year,
            month,
            day

        ) {

            noteDate.textContent =
                `${monthNames[month]} ${day}, ${year}`;


            noteText.textContent =
                "This is where your note for this day will appear.\n\n" +
                "Once we add your daily messages, the text will appear here on the lined paper in a handwritten style.";


            noteOverlay.classList.add(
                "visible"
            );

        }


        /* =====================================================
           CLOSE NOTE
        ====================================================== */

        function closeNoteWindow() {

            noteOverlay.classList.remove(
                "visible"
            );

        }


        closeNote.addEventListener(
            "click",
            closeNoteWindow
        );


        /* =====================================================
           CLICK OUTSIDE NOTE
        ====================================================== */

        noteOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target === noteOverlay
                ) {

                    closeNoteWindow();

                }

            }
        );


        /* =====================================================
           ESCAPE KEY
        ====================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeNoteWindow();

                }

            }
        );


        /* =====================================================
           CREATE CALENDAR
        ====================================================== */

        function createCalendar(

            year,
            month

        ) {

            /*
                Refresh the Eastern date every time
                the calendar is created.
            */

            today =
                getEasternDate();


            calendar.innerHTML = "";


            /* =================================================
               MONTH CONTAINER
            ================================================== */

            const monthContainer =
                document.createElement(
                    "div"
                );


            monthContainer.className =
                "month";


            /* =================================================
               NAVIGATION
            ================================================== */

            const navigation =
                document.createElement(
                    "div"
                );


            navigation.className =
                "navigation";


            /* -------------------------
               Previous
            ------------------------- */

            const previousButton =
                document.createElement(
                    "button"
                );


            previousButton.textContent =
                "←";


            previousButton.className =
                "nav-button";


            if (

                year === startingYear &&
                month === startingMonth

            ) {

                previousButton.disabled =
                    true;

            }


            /* -------------------------
               Title
            ------------------------- */

            const title =
                document.createElement(
                    "h2"
                );


            title.textContent =
                `${monthNames[month]} ${year}`;


            /* -------------------------
               Next
            ------------------------- */

            const nextButton =
                document.createElement(
                    "button"
                );


            nextButton.textContent =
                "→";


            nextButton.className =
                "nav-button";


            navigation.appendChild(
                previousButton
            );


            navigation.appendChild(
                title
            );


            navigation.appendChild(
                nextButton
            );


            monthContainer.appendChild(
                navigation
            );


            /* =================================================
               TODAY BUTTON
            ================================================== */

            const todayButtonContainer =
                document.createElement(
                    "div"
                );


            todayButtonContainer.className =
                "today-button-container";


            const todayButton =
                document.createElement(
                    "button"
                );


            todayButton.textContent =
                "Return to Today";


            todayButton.className =
                "today-button";


            todayButtonContainer.appendChild(
                todayButton
            );


            monthContainer.appendChild(
                todayButtonContainer
            );


            /* =================================================
               WEEKDAYS
            ================================================== */

            const weekdays =
                document.createElement(
                    "div"
                );


            weekdays.className =
                "weekdays";


            weekdayNames.forEach(
                day => {

                    const weekday =
                        document.createElement(
                            "div"
                        );


                    weekday.className =
                        "weekday";


                    weekday.textContent =
                        day;


                    weekdays.appendChild(
                        weekday
                    );

                }
            );


            monthContainer.appendChild(
                weekdays
            );


            /* =================================================
               DAYS
            ================================================== */

            const daysContainer =
                document.createElement(
                    "div"
                );


            daysContainer.className =
                "days";


            /* -------------------------
               First Day
            ------------------------- */

            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            /* -------------------------
               Number Of Days
            ------------------------- */

            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /* -------------------------
               Empty Spaces
            ------------------------- */

            for (

                let i = 0;
                i < firstDay;
                i++

            ) {

                const emptyDay =
                    document.createElement(
                        "div"
                    );


                emptyDay.className =
                    "day empty";


                daysContainer.appendChild(
                    emptyDay
                );

            }


            /* =================================================
               INDIVIDUAL DAYS
            ================================================== */

            for (

                let day = 1;
                day <= daysInMonth;
                day++

            ) {

                const dayBox =
                    document.createElement(
                        "div"
                    );


                const comparison =
                    compareDates(

                        year,
                        month,
                        day,

                        today.year,
                        today.month,
                        today.day

                    );


                /* -------------------------
                   Day Number
                ------------------------- */

                const dayNumber =
                    document.createElement(
                        "span"
                    );


                dayNumber.className =
                    "day-number";


                dayNumber.textContent =
                    day;


                dayBox.appendChild(
                    dayNumber
                );


                /* =================================================
                   FUTURE
                ================================================== */

                if (
                    comparison > 0
                ) {

                    dayBox.className =
                        "day locked";


                    const status =
                        document.createElement(
                            "span"
                        );


                    status.className =
                        "status";


                    status.textContent =
                        "Locked";


                    dayBox.appendChild(
                        status
                    );

                }


                /* =================================================
                   TODAY
                ================================================== */

                else if (
                    comparison === 0
                ) {

                    dayBox.className =
                        "day today";


                    const status =
                        document.createElement(
                            "span"
                        );


                    status.className =
                        "status";


                    status.textContent =
                        "Today";


                    dayBox.appendChild(
                        status
                    );


                    dayBox.addEventListener(
                        "click",
                        () => {

                            openNote(

                                year,
                                month,
                                day

                            );

                        }
                    );

                }


                /* =================================================
                   PAST
                ================================================== */

                else {

                    dayBox.className =
                        "day available";


                    const status =
                        document.createElement(
                            "span"
                        );


                    status.className =
                        "status";


                    status.textContent =
                        "Available";


                    dayBox.appendChild(
                        status
                    );


                    dayBox.addEventListener(
                        "click",
                        () => {

                            openNote(

                                year,
                                month,
                                day

                            );

                        }
                    );

                }


                daysContainer.appendChild(
                    dayBox
                );

            }


            monthContainer.appendChild(
                daysContainer
            );


            calendar.appendChild(
                monthContainer
            );


            /* =================================================
               PREVIOUS MONTH
            ================================================== */

            previousButton.addEventListener(
                "click",
                () => {

                    if (

                        year === startingYear &&
                        month === startingMonth

                    ) {

                        return;

                    }


                    if (
                        currentMonth === 0
                    ) {

                        currentMonth =
                            11;

                        currentYear--;

                    }

                    else {

                        currentMonth--;

                    }


                    createCalendar(

                        currentYear,
                        currentMonth

                    );

                }
            );


            /* =================================================
               NEXT MONTH
            ================================================== */

            nextButton.addEventListener(
                "click",
                () => {

                    if (
                        currentMonth === 11
                    ) {

                        currentMonth =
                            0;

                        currentYear++;

                    }

                    else {

                        currentMonth++;

                    }


                    createCalendar(

                        currentYear,
                        currentMonth

                    );

                }
            );


            /* =================================================
               TODAY BUTTON
            ================================================== */

            todayButton.addEventListener(
                "click",
                () => {

                    const currentDate =
                        getEasternDate();


                    currentMonth =
                        currentDate.month;


                    currentYear =
                        currentDate.year;


                    if (

                        currentYear < startingYear ||

                        (

                            currentYear === startingYear &&
                            currentMonth < startingMonth

                        )

                    ) {

                        currentYear =
                            startingYear;

                        currentMonth =
                            startingMonth;

                    }


                    createCalendar(

                        currentYear,
                        currentMonth

                    );

                }
            );

        }


        /* =====================================================
           START CALENDAR
        ====================================================== */

        createCalendar(

            currentYear,
            currentMonth

        );


    </script>

</body>

</html>
