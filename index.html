<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dear Lucie...</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* -------------------------
           Header
        ------------------------- */

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 10px;
            color: #666;
        }

        /* -------------------------
           Calendar Container
        ------------------------- */

        .calendar-container {
            max-width: 1000px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        /* -------------------------
           Month
        ------------------------- */

        .month {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        /* -------------------------
           Month Navigation
        ------------------------- */

        .navigation {
            display: grid;
            grid-template-columns: 50px 1fr 50px;
            align-items: center;
            margin-bottom: 25px;
        }

        .navigation h2 {
            margin: 0;
            text-align: center;
        }

        .nav-button {
            width: 45px;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 24px;
            cursor: pointer;
        }

        .nav-button:hover {
            background: #eee;
        }

        /* Disabled Previous Button */

        .nav-button:disabled {
            color: #bbb;
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .nav-button:disabled:hover {
            background: #f5f5f5;
        }

        /* -------------------------
           Today Button
        ------------------------- */

        .today-button-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .today-button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            cursor: pointer;
        }

        .today-button:hover {
            background: #eee;
        }

        /* -------------------------
           Weekdays
        ------------------------- */

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            color: #777;
            padding: 8px;
        }

        /* -------------------------
           Calendar Days
        ------------------------- */

        .day {
            min-height: 80px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            background: #fafafa;
            font-size: 16px;
            cursor: pointer;
        }

        .day:hover {
            background: #eee;
        }

        .day.empty {
            border: none;
            background: transparent;
            cursor: default;
        }

        .day.empty:hover {
            background: transparent;
        }

        /* -------------------------
           Today's Highlight
        ------------------------- */

        .day.today {
            border: 2px solid #222;
            background: #e8e8e8;
            font-weight: bold;
        }

        .day.today:hover {
            background: #ddd;
        }

        /* -------------------------
           Mobile
        ------------------------- */

        @media (max-width: 600px) {

            header h1 {
                font-size: 28px;
            }

            .month {
                padding: 15px;
            }

            .day {
                min-height: 55px;
                padding: 6px;
            }

        }

    </style>

</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header>

        <h1>Dear Lucie...</h1>

        <p></p>

    </header>


    <!-- =========================
         Calendar
    ========================== -->

    <div
        class="calendar-container"
        id="calendar">
    </div>


    <!-- =========================
         JavaScript
    ========================== -->

    <script>

        const calendar = document.getElementById("calendar");


        /* -------------------------
           Month Names
        ------------------------- */

        const monthNames = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];


        /* -------------------------
           Weekday Names
        ------------------------- */

        const weekdayNames = [
            "Sun",
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat"
        ];


        /* -------------------------
           Starting Month
        ------------------------- */

        const startingMonth = 8;      // September
        const startingYear = 2026;


        /* -------------------------
           Get Today's Date
           Using Eastern Time
        ------------------------- */

        function getEasternDate() {

            const easternDate =
                new Intl.DateTimeFormat(
                    "en-US",
                    {
                        timeZone: "America/New_York",
                        year: "numeric",
                        month: "numeric",
                        day: "numeric"
                    }
                ).formatToParts(new Date());


            let year;
            let month;
            let day;


            easternDate.forEach(part => {

                if (part.type === "year") {
                    year = Number(part.value);
                }

                if (part.type === "month") {
                    month = Number(part.value) - 1;
                }

                if (part.type === "day") {
                    day = Number(part.value);
                }

            });


            return {
                year: year,
                month: month,
                day: day
            };

        }


        /* -------------------------
           Today's Date
        ------------------------- */

        const today = getEasternDate();


        /* -------------------------
           Current Calendar Month
        ------------------------- */

        let currentMonth = Math.max(
            today.month,
            startingMonth
        );

        let currentYear = Math.max(
            today.year,
            startingYear
        );


        /* -------------------------
           Make Sure Calendar
           Starts At September 2026
        ------------------------- */

        if (
            currentYear === startingYear &&
            currentMonth < startingMonth
        ) {

            currentMonth = startingMonth;

        }


        /* -------------------------
           Create Calendar
        ------------------------- */

        function createCalendar(year, month) {

            /*
                Clear the existing calendar
                before creating the new month.
            */

            calendar.innerHTML = "";


            /* -------------------------
               Month Container
            ------------------------- */

            const monthContainer =
                document.createElement("div");

            monthContainer.className = "month";


            /* -------------------------
               Navigation
            ------------------------- */

            const navigation =
                document.createElement("div");

            navigation.className = "navigation";


            /* Previous Button */

            const previousButton =
                document.createElement("button");

            previousButton.textContent = "←";

            previousButton.className =
                "nav-button";


            /* Disable Previous Button
               At September 2026 */

            if (
                year === startingYear &&
                month === startingMonth
            ) {

                previousButton.disabled = true;

            }


            /* Month Title */

            const title =
                document.createElement("h2");

            title.textContent =
                `${monthNames[month]} ${year}`;


            /* Next Button */

            const nextButton =
                document.createElement("button");

            nextButton.textContent = "→";

            nextButton.className =
                "nav-button";


            /* Add navigation elements */

            navigation.appendChild(
                previousButton
            );

            navigation.appendChild(title);

            navigation.appendChild(
                nextButton
            );


            monthContainer.appendChild(
                navigation
            );


            /* -------------------------
               Today Button
            ------------------------- */

            const todayButtonContainer =
                document.createElement("div");

            todayButtonContainer.className =
                "today-button-container";


            const todayButton =
                document.createElement("button");

            todayButton.textContent =
                "Today";

            todayButton.className =
                "today-button";


            todayButtonContainer.appendChild(
                todayButton
            );


            monthContainer.appendChild(
                todayButtonContainer
            );


            /* -------------------------
               Weekday Headers
            ------------------------- */

            const weekdays =
                document.createElement("div");

            weekdays.className = "weekdays";


            weekdayNames.forEach(day => {

                const weekday =
                    document.createElement("div");

                weekday.className =
                    "weekday";

                weekday.textContent = day;

                weekdays.appendChild(
                    weekday
                );

            });


            monthContainer.appendChild(
                weekdays
            );


            /* -------------------------
               Days Container
            ------------------------- */

            const daysContainer =
                document.createElement("div");

            daysContainer.className = "days";


            /* -------------------------
               First Day of Month
            ------------------------- */

            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            /* -------------------------
               Number of Days
            ------------------------- */

            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /* -------------------------
               Empty Spaces
            ------------------------- */

            for (
                let i = 0;
                i < firstDay;
                i++
            ) {

                const emptyDay =
                    document.createElement("div");

                emptyDay.className =
                    "day empty";

                daysContainer.appendChild(
                    emptyDay
                );

            }


            /* -------------------------
               Create Calendar Days
            ------------------------- */

            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const dayBox =
                    document.createElement("div");


                dayBox.className = "day";


                dayBox.textContent = day;


                /* -------------------------
                   Check If This Is Today
                ------------------------- */

                if (
                    year === today.year &&
                    month === today.month &&
                    day === today.day
                ) {

                    dayBox.classList.add("today");

                }


                daysContainer.appendChild(
                    dayBox
                );

            }


            /* Add days to month */

            monthContainer.appendChild(
                daysContainer
            );


            /* Add month to calendar */

            calendar.appendChild(
                monthContainer
            );


            /* -------------------------
               Previous Month Button
            ------------------------- */

            previousButton.addEventListener(
                "click",
                () => {

                    if (
                        year === startingYear &&
                        month === startingMonth
                    ) {

                        return;

                    }


                    if (currentMonth === 0) {

                        currentMonth = 11;

                        currentYear--;

                    } else {

                        currentMonth--;

                    }


                    createCalendar(
                        currentYear,
                        currentMonth
                    );

                }
            );


            /* -------------------------
               Next Month Button
            ------------------------- */

            nextButton.addEventListener(
                "click",
                () => {

                    if (currentMonth === 11) {

                        currentMonth = 0;

                        currentYear++;

                    } else {

                        currentMonth++;

                    }


                    createCalendar(
                        currentYear,
                        currentMonth
                    );

                }
            );


            /* -------------------------
               Today Button
            ------------------------- */

            todayButton.addEventListener(
                "click",
                () => {

                    /*
                        Get the current Eastern
                        date again in case the
                        day has changed.
                    */

                    const currentDate =
                        getEasternDate();


                    currentMonth =
                        currentDate.month;

                    currentYear =
                        currentDate.year;


                    /*
                        Don't allow the calendar
                        to go before September 2026.
                    */

                    if (
                        currentYear < startingYear ||
                        (
                            currentYear === startingYear &&
                            currentMonth < startingMonth
                        )
                    ) {

                        currentYear =
                            startingYear;

                        currentMonth =
                            startingMonth;

                    }


                    createCalendar(
                        currentYear,
                        currentMonth
                    );

                }
            );

        }


        /* -------------------------
           Start Calendar
        ------------------------- */

        createCalendar(
            currentYear,
            currentMonth
        );

    </script>

</body>

</html>
